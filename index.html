<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シフトメニュー">
<meta name="theme-color" content="#0f0f0f">
<title>南船橋シフトメニュー</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f;
  --surface:#1a1a1a;
  --surface2:#242424;
  --border:rgba(255,255,255,0.08);
  --gold:#f5c200;
  --gold2:#e6a800;
  --gold-dim:rgba(245,194,0,0.10);
  --gold-border:rgba(245,194,0,0.25);
  --text:#f0f0f0;
  --muted:#666;
  --body:'M PLUS Rounded 1c',sans-serif;
  --en:'Nunito',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);}
body{display:flex;flex-direction:column;min-height:100dvh;}
.header{padding:56px 24px 28px;background:linear-gradient(160deg,rgba(245,194,0,0.07) 0%,transparent 60%);border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),transparent);}
.header::after{content:'';position:absolute;top:-60px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(245,194,0,0.06) 0%,transparent 70%);pointer-events:none;}
.gym-label{font-size:10px;letter-spacing:3px;color:var(--gold);font-family:var(--en);font-weight:700;margin-bottom:10px;opacity:0.8;}
.header h1{font-size:28px;font-weight:900;letter-spacing:0.5px;line-height:1.2;font-family:var(--body);}
.header h1 em{color:var(--gold);font-style:normal;}
.header-sub{font-size:11px;color:var(--muted);margin-top:8px;font-family:var(--en);font-weight:600;letter-spacing:2px;}
.install-hint{margin:16px 16px 0;padding:10px 14px;background:rgba(245,194,0,0.04);border:1px solid var(--gold-border);border-radius:12px;font-size:11px;color:var(--muted);display:flex;align-items:flex-start;gap:8px;font-family:var(--body);line-height:1.6;}
.install-hint .icon{font-size:15px;flex-shrink:0;margin-top:1px;}
.install-hint strong{color:rgba(245,194,0,0.8);font-weight:700;}
.cards{flex:1;padding:20px 16px 32px;display:flex;flex-direction:column;gap:12px;}
.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px 22px;text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:transform 0.15s ease,border-color 0.15s ease,background 0.15s ease;-webkit-user-select:none;user-select:none;}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--gold-dim) 0%,transparent 60%);opacity:0;transition:opacity 0.2s ease;}
.card:active{transform:scale(0.975);background:var(--surface2);border-color:var(--gold-border);}
.card:active::before{opacity:1;}
.card-title{font-size:19px;font-weight:800;letter-spacing:0.2px;margin-bottom:5px;font-family:var(--body);}
.card-desc{font-size:12px;color:var(--muted);line-height:1.6;font-family:var(--body);font-weight:500;}
.card-arrow{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--gold);opacity:0.5;font-family:var(--en);font-weight:800;transition:opacity 0.15s,transform 0.15s;}
.card:active .card-arrow{opacity:1;transform:translateY(-50%) translateX(3px);}
.card-accent{position:absolute;left:0;top:16px;bottom:16px;width:3px;background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:0 3px 3px 0;opacity:0.6;}
.footer{padding:16px 24px 28px;text-align:center;font-size:11px;color:rgba(255,255,255,0.15);font-family:var(--en);font-weight:600;letter-spacing:1px;border-top:1px solid var(--border);}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.header{animation:fadeUp 0.4s ease both;}
.install-hint{animation:fadeUp 0.4s 0.1s ease both;}
.card:nth-child(1){animation:fadeUp 0.4s 0.15s ease both;}
.card:nth-child(2){animation:fadeUp 0.4s 0.25s ease both;}
</style>
</head>
<body>
<div class="header">
  <div class="gym-label">GOLD'S GYM MINAMI-FUNABASHI CHIBA</div>
  <h1>南船橋<em>シフトメニュー</em></h1>
  <div class="header-sub">SHIFT MENU</div>
</div>
<div class="install-hint">
  <span class="icon">📱</span>
  <span><strong>ホーム画面に追加</strong>でワンタッチ起動 ／ iPhone: 共有 → ホームに追加　Android: メニュー → ホームに追加</span>
</div>
<div class="cards">
  <a class="card" href="https://thinkgold-my.sharepoint.com/:f:/g/personal/ggmfc_goldsgym_jp/Emcc-7FUZORHv0uxdcFJ8wsBnCVWPJDzecxrpW-uQl8kpQ?e=GFInOX" target="_blank" rel="noopener noreferrer">
    <div class="card-accent"></div>
    <div class="card-title">📅 南船橋シフト</div>
    <div class="card-desc">シフトフォルダを開く</div>
    <div class="card-arrow">›</div>
  </a>
  <a class="card" href="https://glimmer-elephant-b49.notion.site/357ceb4af3b480c392e6c901c182f98a?pvs=105" target="_blank" rel="noopener noreferrer">
    <div class="card-accent"></div>
    <div class="card-title">✏️ シフト申請</div>
    <div class="card-desc">フォームで送信する</div>
    <div class="card-arrow">›</div>
  </a>
</div>
<div class="footer">GOLD'S GYM MFC · 南船橋シフトメニュー</div>
</body>
</html>
